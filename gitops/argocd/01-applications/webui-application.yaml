apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webui
  namespace: argocd
spec:
  ignoreDifferences:
    - group: argocd
      kind: Deployment
      jsonPointers:
      - /metadata/annotations
      jqPathExpressions:
      - .metadata.annotations["imageregistry.io/hash"]
  project: training-project
  source:
    repoURL: https://github.com/angelatg/argocd-gitops.git
    targetRevision: HEAD
    # TODO ejercicio 3:
    # Ajustar al path exacto del componente webui.
    path: k8s/04-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
