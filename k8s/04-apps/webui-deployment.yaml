apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels: 
        app: webui
    spec:
      containers:
        - name: webui
          # Ejercicio 5:
          # Sustituir por la imagen construida para la webui.
          image: angelatrabg/webui:0.0.1
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
          # TODO ejercicio 5:
          # Revisar imagePullPolicy si la imagen se importa o se obtiene desde registry.
          imagePullPolicy: IfNotPresent
